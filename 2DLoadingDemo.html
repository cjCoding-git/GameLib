<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameLib 2D Loading Screen Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0e14; color: #e7edf7; }
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    p { color: #aab3c5; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    button { border: 1px solid #394255; border-radius: 8px; padding: 10px 14px; background: #1b2230; color: inherit; cursor: pointer; }
    button:hover, button:focus-visible { background: #293448; }
    .screen { display: block; width: min(100%, 800px); aspect-ratio: 16 / 9; border: 1px solid #394255; border-radius: 10px; background: #10131c; }
    #render-canvas { display: none; }
    #message { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>GameLib 2D Loading Screen</h1>
  <p>Switch between the built-in default and a preconfigured custom screen. The custom demo simulates progress updates.</p>
  <div class="toolbar">
    <button id="default-screen" type="button">Show default screen</button>
    <button id="custom-screen" type="button">Show custom screen</button>
    <button id="finish-loading" type="button">Finish loading</button>
  </div>
  <canvas id="viewport-canvas" class="screen" width="800" height="450" aria-label="Game loading screen preview"></canvas>
  <canvas id="render-canvas" width="800" height="450"></canvas>
  <p id="message" aria-live="polite">Default loading screen (indeterminate progress).</p>

  <script type="module">
    import "./src/index.js";

    const viewportCanvas = document.querySelector("#viewport-canvas");
    const renderCanvas = document.querySelector("#render-canvas");
    const game = new GameLib2D.GameLib(
      renderCanvas,
      GameLib2D.GameLib.getContext(renderCanvas),
      viewportCanvas,
      GameLib2D.GameLib.getContext(viewportCanvas)
    );
    const message = document.querySelector("#message");
    let progressTimer = null;

    // Draw a small logo locally so the demo has no external asset dependencies.
    const logo = document.createElement("canvas");
    logo.width = 128;
    logo.height = 128;
    const logoCtx = logo.getContext("2d");
    logoCtx.fillStyle = "#78e0a3";
    logoCtx.beginPath();
    logoCtx.roundRect(8, 8, 112, 112, 28);
    logoCtx.fill();
    logoCtx.fillStyle = "#102319";
    logoCtx.font = "bold 60px sans-serif";
    logoCtx.textAlign = "center";
    logoCtx.textBaseline = "middle";
    logoCtx.fillText("G", 64, 65);

    function stopProgress() {
      if (progressTimer !== null) {
        window.clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    function showDefault() {
      stopProgress();
      game.setLoadingScreen(null);
      game.setScene("loading");
      message.textContent = "Default loading screen (indeterminate progress).";
    }

    function showCustom() {
      stopProgress();
      game.setScene("loading");
      const config = {
        background: "#17233b",
        backgroundImage: null,
        logo,
        title: "GAMELIB",
        status: "Preparing game assets…",
        progress: 0,
        textColor: "#f4f7ff",
        mutedTextColor: "#bdc9df",
        progressTrackColor: "#35445f",
        progressColor: "#78e0a3",
        titleFont: "bold 34px system-ui, sans-serif",
        font: "16px system-ui, sans-serif",
        progressWidth: 340,
        progressHeight: 14,
        logoWidth: 76,
        logoHeight: 76
      };
      game.setLoadingScreen(config);
      message.textContent = "Custom loading screen; progress advances automatically.";
      progressTimer = window.setInterval(() => {
        config.progress = Math.min(1, config.progress + 0.02);
        config.status = config.progress >= 1 ? "Ready!" : "Preparing game assets…";
        game.setLoadingScreen(config);
        if (config.progress >= 1) {
          stopProgress();
        }
      }, 120);
    }

    document.querySelector("#default-screen").addEventListener("click", showDefault);
    document.querySelector("#custom-screen").addEventListener("click", showCustom);
    document.querySelector("#finish-loading").addEventListener("click", () => {
      stopProgress();
      game.setScene("init");
      message.textContent = "Loading finished. Use either screen button to preview again.";
    });

    game.mainloop();
    showDefault();
  </script>
</body>
</html>
