<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameLib 3D Rotating Cube Test</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10131c;
      color: #eef2ff;
      font: 14px/1.5 system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: fixed;
      top: 1rem;
      left: 1rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid #ffffff30;
      border-radius: 0.5rem;
      background: #10131ccc;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="A rotating 3D cube"></canvas>
  <div id="status" role="status">Starting GameLib 3D test…</div>

  <script src="https://cdn.jsdelivr.net/gh/cjCoding-git/GameLib@c759063/dist/GameLib-1.0.4.min.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("game-canvas");
      const status = document.getElementById("status");
      const { GameLib3D } = self;

      function showError(message) {
        status.textContent = message;
        status.style.color = "#ffb4b4";
        console.error(message);
      }

      if (!GameLib3D) {
        showError("GameLib3D did not load. Check the bundle path.");
        return;
      }

      const gl = GameLib3D.GameLib.getContext(canvas);
      if (!gl) {
        showError("WebGL 2 is unavailable in this browser.");
        return;
      }

      const vertexShaderSource = `#version 300 es
        in vec3 aVertexPosition;
        in vec3 aVertexNormal;
        in vec4 aVertexColor;
        uniform mat4 uProjectionMatrix;
        uniform mat4 uModelViewMatrix;
        uniform mat4 uNormalMatrix;
        out vec3 vNormal;
        out vec4 vColor;

        void main() {
          gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aVertexPosition, 1.0);
          vNormal = mat3(uNormalMatrix) * aVertexNormal;
          vColor = aVertexColor;
        }
      `;

      const fragmentShaderSource = `#version 300 es
        precision highp float;
        in vec3 vNormal;
        in vec4 vColor;
        out vec4 outColor;

        void main() {
          vec3 normal = normalize(vNormal);
          vec3 lightDirection = normalize(vec3(0.7, 0.8, 1.0));
          float diffuse = max(dot(normal, lightDirection), 0.0);
          float lighting = 0.28 + 0.72 * diffuse;
          outColor = vec4(vColor.rgb * lighting, vColor.a);
        }
      `;

      const game = new GameLib3D.GameLib(canvas, gl);
      game.setClearColor([0.04, 0.05, 0.09, 1.0]);

      const vertexShader = game.compileShader(gl.VERTEX_SHADER, vertexShaderSource);
      const fragmentShader = game.compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
      if (!vertexShader || !fragmentShader) {
        showError("Could not compile the cube shaders. See the browser console.");
        return;
      }

      const program = game.createProgram(vertexShader, fragmentShader);
      if (!program) {
        showError("Could not link the cube shader program. See the browser console.");
        return;
      }
      game.useProgram(program);

      const camera = new GameLib3D.Camera(45, 0.1, 100);
      const cube = new GameLib3D.Mesh(
        game,
        new GameLib3D.Geometry.Box(1.6, 1.6, 1.6),
        [0.25, 0.68, 1.0, 1.0]
      );
      cube.transform.position.z = -4;
      game.setCamera(camera);
      game.addObject(cube);

      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.floor(canvas.clientWidth * pixelRatio));
        const height = Math.max(1, Math.floor(canvas.clientHeight * pixelRatio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        gl.viewport(0, 0, width, height);
      }

      resizeCanvas();
      game.addHook("pre-render", resizeCanvas);

      let previousTime = 0;
      game.addHook("pre-update", () => {
        const now = performance.now();
        const deltaSeconds = previousTime === 0 ? 0 : (now - previousTime) / 1000;
        previousTime = now;
        cube.transform.rotate(0.65 * deltaSeconds, 0.9 * deltaSeconds, 0.25 * deltaSeconds);
      });

      game.setActive(true);
      game.setRendering(true);
      status.textContent = "GameLib 3D is rendering — rotating cube";
      window.addEventListener("resize", resizeCanvas);
    })();
  </script>
</body>
</html>
