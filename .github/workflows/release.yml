name: Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.x.x)'
        required: true
        default: ''
        type: string
      body:
        description: 'Release Notes'
        required: true
        default: 'No Release Notes'
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Update package.json
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          date > buildtime.txt
          echo "${{ inputs.version }}" > buildversion.txt
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install dependencies
        run: |
          npm install
          npm install -g esbuild
          npm install -g terser
      - name: Clean dist directory
        run: |
          rm -rf dist/*
          mkdir -p dist/
      - name: Create build files
        run: |
          VERSION="${{ inputs.version }}"
          UNMINIFIED_OUT="dist/GameLib.js"
          MINIFIED_OUT="dist/GameLib.min.js"
          node esbuild.config.mjs
          echo Minifing with Terser...
          npx terser $UNMINIFIED_OUT -o $MINIFIED_OUT --config-file terser.config.json
          echo Files minified!
      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add package-lock.json
          git add buildtime.txt
          git add buildversion.txt
          git add dist/
          git diff-index --quiet HEAD || git commit -m "chore: release version ${{ inputs.version }}"
          git push origin main
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          body: "Release Notes: ${{ inputs.body }}"
          files: |
            dist/GameLib.js
            dist/GameLib.min.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug NPM Auth
        run: |
          echo "Checking npm registry auth configuration:"
          npm config get registry
          ls -la ~/.npmrc 2>/dev/null || echo "No global .npmrc found"
      - name: Release to GitHub NPM
        run: |
          npx npm@latest publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconfigure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Debug NPM Auth
        run: |
          echo "Checking npm registry auth configuration:"
          npm config get registry
          ls -la ~/.npmrc 2>/dev/null || echo "No global .npmrc found"
      - name: Release to NPM
        run: |
          npx npm@latest publish --provenance --access public --tag latest
